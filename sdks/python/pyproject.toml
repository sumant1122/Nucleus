[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nucleus-sdk"
version = "0.1.0"
description = "Python SDK for the Nucleus agent sandbox service."
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx-mock>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["nucleus_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
